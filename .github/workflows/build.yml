name: Derleme

# Her değişiklikte: oyunu Godot ile açıp betik hatası var mı bakar,
# sonra tablete yüklenebilen bir Android test dosyası (APK) üretir.
# APK, çalışmanın "Artifacts" bölümünden indirilir.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6.3"
  GODOT_MINOR: "4.6"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot ve dışa aktarma şablonlarını indir
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" /tmp/tpl
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Projeyi içe aktar, betikleri ve testleri kontrol et
        run: |
          ./godot --headless --path . --import 2>&1 | tee import.log
          ./godot --headless --path . --quit-after 180 2>&1 | tee run.log
          ./godot --headless --path . --script res://tests/test_runner.gd 2>&1 | tee test.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" import.log run.log test.log; then
            echo "::error::Godot betik hatası bulundu"
            exit 1
          fi

      - name: Android ayarlarını hazırla
        run: |
          # Sabit test anahtarı: her derleme aynı imzayı taşır, böylece yeni APK eskisinin üstüne kurulur.
          cp android/debug.keystore "$PWD/debug.keystore"
          # Her derlemeye artan sürüm numarası ver (Android güncellemeyi kabul etsin).
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$PWD/debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > "$HOME/.config/godot/editor_settings-${GODOT_MINOR}.tres"

      - name: Android test sürümünü (APK) oluştur
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" build/berenin-adasi.apk 2>&1 | tee export.log
          test -s build/berenin-adasi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: berenin-adasi-android
          path: build/berenin-adasi.apk
          retention-days: 30
